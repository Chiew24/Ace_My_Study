<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Ace My Study</title>
  <link rel="stylesheet" href="assets/css/auth.css">
</head>
<body class="auth-page">
  <main class="auth-shell">
    <a class="auth-brand" href="index.html" aria-label="Back to Ace My Study home">
      <img src="Learn%20with%20Shen.png" alt="Ace My Study logo">
    </a>

    <section class="auth-card">
      <div id="loginView">
        <h1>Welcome back</h1>
        <p class="auth-subtitle">Sign in to continue your learning journey.</p>

        <form class="auth-form" id="loginForm">
          <div class="auth-field">
            <label for="loginEmail">Email</label>
            <input id="loginEmail" name="email" type="email" autocomplete="email" placeholder="you@example.com" required>
          </div>
          <div class="auth-field">
            <label for="loginPassword">Password</label>
            <input id="loginPassword" name="password" type="password" autocomplete="current-password" placeholder="Enter your password" required>
          </div>
          <button class="auth-submit" type="submit">Log in</button>
        </form>

        <p class="auth-switch">Don't have an account? <button class="auth-link" type="button" data-show-signup>Sign up</button></p>
      </div>

      <div id="signupView" hidden>
        <h1>Create account</h1>
        <p class="auth-subtitle">Create your account and start learning.</p>

        <form class="auth-form" id="signupForm">
          <div class="auth-field">
            <label for="signupName">Name</label>
            <input id="signupName" name="full_name" type="text" autocomplete="name" placeholder="Your name" required>
          </div>
          <div class="auth-field">
            <label for="signupEmail">Email</label>
            <input id="signupEmail" name="email" type="email" autocomplete="email" placeholder="you@example.com" required>
          </div>
          <div class="auth-field">
            <label for="signupPassword">Password</label>
            <input id="signupPassword" name="password" type="password" autocomplete="new-password" minlength="6" placeholder="At least 6 characters" required>
          </div>
          <button class="auth-submit" type="submit">Create account</button>
        </form>

        <p class="auth-switch">Already have an account? <button class="auth-link" type="button" data-show-login>Log in</button></p>
      </div>

      <p class="auth-message" id="authMessage" role="status" aria-live="polite"></p>
    </section>
  </main>

  <script src="assets/js/auth.js"></script>
</body>
</html>
