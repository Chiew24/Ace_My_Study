<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Question Bank - Ace My Study</title><link rel="stylesheet" href="assets/css/style.css"><link rel="stylesheet" href="assets/css/polish.css"><link rel="stylesheet" href="assets/css/sidebar-black.css"><link rel="stylesheet" href="assets/css/cream-brown-theme.css?v=20260909-3"><style>.student-question-list{margin-top:24px;display:grid;gap:14px;max-width:980px}.student-question-card{background:#fffdf9;border:1px solid #e4d8c9;border-radius:18px;padding:22px 24px;box-shadow:0 10px 30px rgba(92,64,39,.05)}.student-question-number{font-size:12px;font-weight:700;color:#765338;letter-spacing:.08em;text-transform:uppercase;margin-bottom:10px}.student-question-text{font-size:17px;line-height:1.7;color:#102746;white-space:pre-wrap}.student-question-meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.student-question-tag{border:1px solid #dfcfbd;background:#f5ecdf;color:#765338;border-radius:999px;padding:5px 10px;font-size:12px}.student-question-state{padding:26px;border:1px dashed #dccdbb;border-radius:18px;background:rgba(255,253,249,.7);color:#718095}.student-question-error{color:#a64b3d;border-color:#e5b8af;background:#fff7f5}</style></head><body><aside class="sidebar"><div class="brand"><img src="assets/images/Ace%20My%20Study.png" alt="Ace My Study logo"></div><div class="profile-card"><div class="avatar">C</div><div class="profile-name">Chiew Mu Shen</div></div><p class="menu-title">MENU</p><nav class="sidebar-nav"><a class="nav-item" href="overview.html"><span class="icon"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><rect x="14" y="14" width="6" height="6" rx="1"/></svg></span><span>Overview</span></a></nav><p class="menu-title sidebar-section-title">SYLLABUS</p><nav class="sidebar-nav"><a class="nav-item" href="subjects.html"><span class="icon"><svg viewBox="0 0 24 24"><path d="M5 7.5h14v11H5z"/><path d="M8 7.5V5h8v2.5M9 11h6M9 14h6"/></svg></span><span>Subject</span></a></nav><div class="sidebar-subjects" id="sidebarSubjects"></div><p class="menu-title sidebar-section-title">ACCOUNT</p><nav class="sidebar-nav"><a class="nav-item" href="profile.html"><span class="icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M5.5 20c.8-3.2 3-5 6.5-5s5.7 1.8 6.5 5"/></svg></span><span>Profile</span></a></nav></aside><main class="main-content"><div class="topbar"><svg class="topbar-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg></div><section class="page-heading course-page"><a class="back-link" id="backToCourse" href="subjects.html">← Back to Subjects</a><div class="course-intro"><div><h1 id="questionBankTitle">Question Bank</h1><p>Practise questions and strengthen your understanding.</p></div><span class="course-badge">Question Bank</span></div><div id="studentQuestionList" class="student-question-list"><div class="student-question-state">Loading questions…</div></div></section></main><script src="assets/js/auth.js"></script><script src="assets/js/sidebar.js"></script><script>const params=new URLSearchParams(window.location.search),subject=params.get('subject');const list=document.getElementById('studentQuestionList');if(subject){document.getElementById('questionBankTitle').textContent=subject+' Question Bank';document.title=subject+' Question Bank - Ace My Study';document.getElementById('backToCourse').href='course.html?subject='+encodeURIComponent(subject);}function esc(v){return String(v??'').replace(/[&<>\'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\'':'&#39;','"':'&quot;'}[c]));}async function loadQuestions(){if(!subject){list.innerHTML='<div class="student-question-state">Please select a subject first.</div>';return}try{const db=await AceMyStudyAuth.getClient();const {data:sub,error:subError}=await db.from('subjects').select('id,name').eq('name',subject).maybeSingle();if(subError)throw subError;if(!sub){list.innerHTML='<div class="student-question-state">This subject is not available yet.</div>';return}const {data:chapters,error:chapterError}=await db.from('chapters').select('id,title').eq('subject_id',sub.id).eq('is_published',true).order('chapter_number');if(chapterError)throw chapterError;const ids=(chapters||[]).map(x=>x.id);if(!ids.length){list.innerHTML='<div class="student-question-state">No questions are available for this subject yet.</div>';return}const {data:questions,error:qError}=await db.from('exercises').select('id,chapter_id,question,difficulty,year,marks').in('chapter_id',ids).eq('is_published',true).order('display_order').order('id');if(qError)throw qError;const chapterMap=Object.fromEntries((chapters||[]).map(x=>[x.id,x.title]));if(!questions?.length){list.innerHTML='<div class="student-question-state">No questions are available for this subject yet.</div>';return}list.innerHTML=questions.map((q,i)=>`<article class="student-question-card"><div class="student-question-number">Question ${i+1}</div><div class="student-question-text">${esc(q.question)}</div><div class="student-question-meta">${q.difficulty?`<span class="student-question-tag">${esc(q.difficulty)}</span>`:''}${q.year?`<span class="student-question-tag">${esc(q.year)}</span>`:''}${q.marks?`<span class="student-question-tag">${esc(q.marks)} marks</span>`:''}<span class="student-question-tag">${esc(chapterMap[q.chapter_id]||'Chapter')}</span></div></article>`).join('')}catch(error){console.error(error);list.innerHTML=`<div class="student-question-state student-question-error">Unable to load questions. Please try again later.</div>`}}loadQuestions();</script></body></html>
